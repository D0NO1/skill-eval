name: Feature request
description: Suggest a grader, adapter, or workflow improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test or automate, and what's missing?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed shape
      description: CLI flags, grader.yaml syntax, or adapter API as you'd imagine it.
