name: Bug report
description: Something in skillev misbehaves.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and its full output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skillev version
      placeholder: skillev --version
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, agent adapter in use.
    validations:
      required: true
